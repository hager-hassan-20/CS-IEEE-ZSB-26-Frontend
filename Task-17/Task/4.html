<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Learn JavaScript</title>
  </head>
  <body>
    <script>
// The Object To Work With
let myFavGames = {
  "Trinity Universe": {
    publisher: "NIS America",
    price: 40,
  },
  "Titan Quest": {
    publisher: "THQ",
    bestThree: {
      one: "Immortal Throne",
      two: "Ragnarök",
      three: "Atlantis",
    },
    price: 50,
  },
  YS: {
    publisher: "Falcom",
    bestThree: {
      one: "Oath in Felghana",
      two: "Ark Of Napishtim",
      three: "origin",
    },
    price: 40,
  },
};

// Code One => How To Get Object Length ?
let objectLength = 0;
let keys = [];

for (let game in myFavGames) {
  objectLength++;
  keys.push(game);
}

for (let i = 0; i < objectLength; i++) {
  let game = keys[i];

  console.log(`The Game Name Is ${game}`);
  console.log(`The Publisher Is ${myFavGames[game].publisher}`);
  console.log(`The Price Is ${myFavGames[game].price}`);

  // Check If Nested Object Has Property (bestThree)
  if (myFavGames[game].bestThree) {
    console.log("- Game Has Releases");
    console.log(`First => ${myFavGames[game].bestThree.one}`);
    console.log(`Second => ${myFavGames[game].bestThree.two}`);
    console.log(`Third => ${myFavGames[game].bestThree.three}`);
  }
  console.log("#".repeat(20));
}

    </script>
  </body>

</html>
