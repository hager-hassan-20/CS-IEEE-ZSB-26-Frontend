  <body>
    <script>
        function sevenBoom(arr) {
            let str = arr.join("")
            if(str.includes("7")){
                    return "Boom!"
                }else{
                    return "there is no 7 in the array"
                }

            }
        console.log(sevenBoom([1, 2, 3, 4, 5, 6, 7]))
    </script>
