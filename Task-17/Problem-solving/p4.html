<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Learn JavaScript</title>
  </head>
  <body>
    <script>
        function matchHouses(step) {
          if(step === 0){
            return 0
          }else{
            return step * 5 + 1
          }
        }
        console.log(matchHouses(4))
    </script>
  </body>

</html>
