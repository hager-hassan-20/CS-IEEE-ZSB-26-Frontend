<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn JavaScript</title>
</head>
<body>
    <div>
    <span>Hello</span>
    <!-- We Need The Next Text Without Spaces -->
    Elzero
</div>
<script>
    
    let div = document.querySelector("div")
    let current = div.firstChild

    while(current){
        if (current.nodeType === 3 && current.textContent.trim() !== "") {
                if (current.textContent.trim() === "Elzero") {
                    console.log(current.textContent.trim());
            }
        }
        current = current.nextSibling
        }
</script>
</body>
</html>
