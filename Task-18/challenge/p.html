<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator App</title>
    <link rel="stylesheet" href="p.css" />
</head>
<body>
    <div class="container">
        <div class="inputs">
        <div>
        <label>DAY</label>
        <input type="number" class="day" placeholder="DD">
        </div>

        <div>
        <label>MONTH</label>
        <input type="number" class="month" placeholder="MM">
        </div>

        <div>
        <label>YEAR</label>
        <input type="number" class="year" placeholder="YYYY">
        </div>
    </div>
    
    <div class="result">
    <p><span class="years">--</span> years</p>
    <p><span class="months">--</span> months</p>
    <p><span class="days">--</span> days</p>
    </div>

    </div>
    <script src="p.js"></script>
</body>
</html>
