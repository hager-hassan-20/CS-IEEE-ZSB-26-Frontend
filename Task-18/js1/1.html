<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Learn JavaScript</title>
  </head>
  <body>
    <div id="elzero" class="element" name="js">JavaScript</div>
    <script>
       
       let element1 = document.getElementById("elzero")
       let element2 = document.getElementsByTagName("div")
       let element3 = document.getElementsByClassName("element")
       let element4 = document.querySelector(".element")
       let element5 = document.querySelector("[name='js']")
       let element6 = document.querySelector("div")
       let element7 = document.querySelector("#elzero")

       let element12 = document.body.childNodes
       let element13 = document.body.children
       let element14 = document.body.firstElementChild
       let element15 = document.body.firstChild.nextSibling


       console.log(element1)
       console.log(element2)
       console.log(element3)
       console.log(element4)

  </body>
