    <title>Learn JavaScript</title>

  <body>
    <script>
        let nums = [2, 12, 11, 5, 10, 1, 99]

        let result = nums.reduce((acc, curr) => {
            if (curr % 2 === 0) {
              return acc * curr
            } else {
                return acc + curr
        }
        } )

console.log(result)
    </script>
  </body>
