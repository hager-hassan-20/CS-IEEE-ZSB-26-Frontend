<!DOCTYPE html>
<html lang="en">

    <title>Learn JavaScript</title>
  </head>
  <body>
    <script>
      function possibleBonus(a, b){
        if( a<b && (b-a) <= 6){
            return true
        }else{
            return false
        }
    }
    console.log(possibleBonus(3, 7))
    console.log(possibleBonus(1, 9))
    console.log(possibleBonus(5, 3))
      
    </script>
  </body>

</html>
