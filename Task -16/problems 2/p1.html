<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Learn JavaScript</title>
  </head>
  <body>
    <script>
      function leapYear(year){
        
            if(year %4 == 0){
                return true
            }else if(year %100 == 0){
                return false
            }else if(year %400 == 0){
                return true
            }else{
                return false
            }

        }
    console.log(leapYear(2021))
      
    </script>
  </body>

</html>
