<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Learn JavaScript</title>
  </head>
  <body>
    <script>
      function getAbsSum(arr){
        return arr.filter(num => true).reduce((sum,num) => sum + Math.abs(num), 0)
        }
    console.log(getAbsSum([2, -1, 4, 8, 10]))
      
    </script>
  </body>

</html>
