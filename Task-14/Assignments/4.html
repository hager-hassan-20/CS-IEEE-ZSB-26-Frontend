<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Learn JavaScript</title>
  </head>
  <body>
    <script>
    let dayType = "Weekend";

    switch(dayType){
        case "Weekday":
            console.log("It's a regular workday. Time tohustle!")
            break

        case "Weekend":
            console.log("It's the weekend! Time to relaxand unwind.")
            break

        case "Holiday":
            console.log("Enjoy your holiday! Take a break.")
            break

        case "Vacation":
            console.log("You're on vacation! Make the mostof it.")
            break  
        
        default:
            console.log("Not sure about this day type.")    
    }
        
    </script>
  </body>

</html>
