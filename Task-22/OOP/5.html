<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>JS</title>
</head>
<body>
    <script>
        const myObj = {
  username: "Elzero",
  id: 100,
  score: 1000,
  country: "Egypt",
};

Object.defineProperties(myObj, {
    score: {
        writable: false
    },
    id: {
        enumerable:false
    },
    country: {
        enumerable:false,
        configurable:true
    }

})
delete myObj.country

myObj.score = 500;

for (let prop in myObj) {
  console.log(`${prop} => ${myObj[prop]}`);
}

console.log(myObj);

    </script>
</body>
</html>
