<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Learn JS</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Cairo&family=Roboto&display=swap" rel="stylesheet">
    <style>

        body {
            font-family: 'Open Sans' , sans-serif;
            font-size: 16px;
            color: rgb(100, 100, 100);
            padding: 20px;
        }

        .controls {
            background-color: #eee;
            margin-bottom: 20px;
        }

        select {
            padding: 10px;
            margin-right: 10px;
        }

    </style>
</head>
<body>
    <div class="controls">
        <select class="fonts">
            <option value="Open Sans">Open</option>
            <option value="Cairo">Cairo</option>
            <option value="Roboto">Roboto</option>
        </select>

        <select class="colors">

            <option value="black">Black</option>
            <option value="red">Red</option>
            <option value="green">Green</option>
            <option value="blue">Blue</option>
            <option value="purple">Purple</option>
            <option value="yellow">Yellow</option>

        </select>

        <select class="sizes">

            <option value="16px">16</option>
            <option value="18px">18</option>
            <option value="20px">20</option>
            <option value="22px">22</option>
            <option value="24px">24</option>
            <option value="26px">26</option>
            <option value="28px">28</option>
            <option value="30px">30</option>

        </select>

    </div>

    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. 
        Consequuntur maiores eos fugiat, iste fuga earum quasi. Commodi accusantium inventore corporis, in debitis, tenetur ex voluptates sed nisi quis, asperiores et!
    </p>

    <script>

        let fonts = document.querySelector(".fonts");
        let colors = document.querySelector(".colors");
        let sizes = document.querySelector(".sizes");

        if (localStorage.getItem("font")) {

            document.body.style.fontFamily = localStorage.getItem("font");
        }

        if (localStorage.getItem("color")) {

            document.body.style.color = localStorage.getItem("color");
        }

        if (localStorage.getItem("size")) {

            document.body.style.fontSize = localStorage.getItem("size");
        }

        fonts.onchange = function () {

            document.body.style.fontFamily = this.value;

            localStorage.setItem("font", this.value);
        }

        colors.onchange = function () {

            document.body.style.color = this.value;

            localStorage.setItem("color", this.value);
        }

        sizes.onchange = function () {

            document.body.style.fontSize = this.value;

            localStorage.setItem("size", this.value);
        }

    </script>
</body>
</html>
